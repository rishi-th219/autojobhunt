<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #10b981;
    }
    p {
      font-size: 12px;
      color: #94a3b8;
      margin: 0 0 14px 0;
      line-height: 1.4;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #334155;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    button {
      width: 100%;
      background: #10b981;
      color: #0f172a;
      border: none;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #059669;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <h3>⚡ AutoJobHunt</h3>
  <p>Uses your current browser session and saved logins to autofill job applications instantly.</p>
  
  <div class="status-badge">
    <div class="dot"></div>
    <span>Dashboard: http://localhost:5000</span>
  </div>

  <button id="fill-btn">⚡ AutoFill This Tab</button>

  <script src="popup.js"></script>
</body>
</html>
